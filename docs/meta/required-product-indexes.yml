# Products that must have an index page on this MkDocs site.
# scripts/check_required_product_indexes.py fails the build when any
# listed page is missing on disk or missing from mkdocs.yml nav, and
# when the product repo's default branch has a commit after the end of
# last_reviewed in America/New_York. Bumping last_reviewed is the
# attestation that the index was looked at again. The check does not
# judge whether the prose changed.
# Add a product here only together with its stub page and nav entry.
