name: Required product indexes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  product-indexes:
    name: Fail if a known product has no index page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install pyyaml==6.0.3

      - name: Check required product indexes
        run: python scripts/check_required_product_indexes.py
