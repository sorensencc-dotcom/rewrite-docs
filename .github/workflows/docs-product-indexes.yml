name: Required product indexes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  product-indexes:
    name: Fail if a known product index is missing or stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser and zone data
        run: python -m pip install pyyaml==6.0.3 tzdata==2026.4

      # The checker calls api.github.com with no Authorization header.
      # These product repos are public, so that is enough. This job's
      # GITHUB_TOKEN is scoped to rewrite-docs: contents: read does not
      # grant read on the other repos, and sending the token makes GitHub
      # answer 404 for a repo the token cannot see. Do not add a secret.
      # Clear the token for this step so a later edit cannot pass it by accident.
      - name: Check required product indexes
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: python scripts/check_required_product_indexes.py
