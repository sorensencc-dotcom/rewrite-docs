name: CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout submodules (optional private authentication)
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SUBMODULE_PAT }}" ]; then
            git config --global url."https://x-access-token:${{ secrets.SUBMODULE_PAT }}@github.com/sorensencc-dotcom/claude-setup.git".insteadOf "https://github.com/sorensencc-dotcom/claude-setup.git"
          fi
          git submodule update --init --recursive || true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Publish artifacts
        if: github.ref == 'refs/heads/main'
        run: echo "Artifacts would be published here"
